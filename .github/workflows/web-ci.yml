name: "🌐 Web CI"

on:
  push:
    branches: [dev, main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [dev, main, "feature/*", "defect/*"]
    paths:
      - "web/**"

env:
  NODE_VERSION: "24"

jobs:
  lint-and-build:
    name: Lint & Build (Vite + React)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci
        working-directory: web

      - name: 🔍 Run ESLint
        run: npm run lint
        working-directory: web

      - name: 🏗️ TypeScript Type Check
        run: npx tsc -b --noEmit
        working-directory: web

      - name: 📦 Test Build
        run: npm run build
        working-directory: web
        env:
          VITE_API_URL: 'http://localhost:5555' # Mock URL for build purpose
